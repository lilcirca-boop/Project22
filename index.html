<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stealth Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    body {
      background: #000;
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .panel {
      background: radial-gradient(circle at top, #222 0, #050505 55%, #000 100%);
      border-radius: 18px;
      padding: 28px 22px 26px;
      border: 1px solid #222;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .title {
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 20px;
    }

    /* PIN SCREEN */
    #pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .pin-instruction {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    .pin-dots {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #050505;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .pin-dot.filled {
      background: #0af;
      border-color: #0af;
    }

    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 8px;
    }

    .pin-key {
      width: 70px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid #222;
      background: #101010;
      color: #eee;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.13s ease, transform 0.08s ease, border-color 0.13s ease;
    }

    .pin-key:active {
      transform: scale(0.96);
      background: #181818;
      border-color: #333;
    }

    .pin-key.wide {
      grid-column: span 3;
      font-size: 0.85rem;
      color: #777;
    }

    .error-msg {
      min-height: 18px;
      margin-top: 4px;
      font-size: 0.8rem;
      color: #f55;
      text-align: center;
      letter-spacing: 0.03em;
    }

    /* DASHBOARD */
    #dashboard {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .protocol-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #999;
      text-align: center;
    }

    .protocol-text {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #d0d0d0;
      text-align: center;
    }

    .toggle-wrapper {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .power-toggle {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid #330000;
      background: radial-gradient(circle at 30% 0, #222 0, #050505 55%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .power-toggle.off {
      border-color: #550000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
    }

    .power-toggle.on {
      border-color: #00aa55;
      box-shadow: 0 0 24px rgba(0, 255, 120, 0.35);
      background: radial-gradient(circle at 30% 0, #1e3b2a 0, #031108 55%, #000 100%);
    }

    .power-symbol {
      position: relative;
      width: 40px;
      height: 40px;
    }

    .power-circle {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid currentColor;
      border-top-color: transparent;
      border-right-color: transparent;
      transform: rotate(-45deg);
    }

    .power-line {
      position: absolute;
      left: 50%;
      top: 5px;
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: currentColor;
      transform: translateX(-50%);
    }

    .status-text {
      margin-top: 16px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c33;
      text-align: center;
    }

    .status-text.on {
      color: #4fd57a;
    }

    @media (max-width: 480px) {
      .panel {
        padding: 22px 18px 22px;
      }
      .pin-key {
        width: 100%;
      }
      .power-toggle {
        width: 88px;
        height: 88px;
      }
      .power-symbol {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="title">Access</div>

      <!-- PIN SCREEN -->
      <div id="pin-screen">
        <div class="pin-instruction">
          Enter access code
          <div class="pin-dots">
            <div class="pin-dot" data-index="0"></div>
            <div class="pin-dot" data-index="1"></div>
            <div class="pin-dot" data-index="2"></div>
            <div class="pin-dot" data-index="3"></div>
          </div>
        </div>

        <div class="pin-grid">
          <div class="pin-key" data-key="1">1</div>
          <div class="pin-key" data-key="2">2</div>
          <div class="pin-key" data-key="3">3</div>
          <div class="pin-key" data-key="4">4</div>
          <div class="pin-key" data-key="5">5</div>
          <div class="pin-key" data-key="6">6</div>
          <div class="pin-key" data-key="7">7</div>
          <div class="pin-key" data-key="8">8</div>
          <div class="pin-key" data-key="9">9</div>
          <div class="pin-key" data-key="clear">CLR</div>
          <div class="pin-key" data-key="0">0</div>
          <div class="pin-key" data-key="back">⌫</div>
        </div>

        <div class="error-msg" id="pin-error"></div>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboard">
        <div>
          <div class="protocol-label">Protocol</div>
          <div class="protocol-text" id="protocol-descriptor">
            Stealth Link v0.1
          </div>
        </div>

        <div class="toggle-wrapper">
          <button id="power-toggle" class="power-toggle off" aria-pressed="false">
            <div class="power-symbol">
              <div class="power-circle"></div>
              <div class="power-line"></div>
            </div>
          </button>
        </div>

        <div id="status-text" class="status-text">Status &bull; OFFLINE</div>
      </div>
    </div>
  </div>

  <script>
    // ----- PIN LOGIC -----
    const REQUIRED_PIN = "8236";

    const pinScreen = document.getElementById("pin-screen");
    const dashboard = document.getElementById("dashboard");
    const pinDots = document.querySelectorAll(".pin-dot");
    const pinError = document.getElementById("pin-error");

    let buffer = "";
    let lockedOut = false;

    function updateDots() {
      pinDots.forEach((dot, i) => {
        if (i < buffer.length) {
          dot.classList.add("filled");
        } else {
          dot.classList.remove("filled");
        }
      });
    }

    function resetPin(shake = false) {
      buffer = "";
      updateDots();
      if (!shake) return;
      pinError.textContent = "Access denied";
      setTimeout(() => {
        pinError.textContent = "";
      }, 1200);
    }

    function handleDigit(d) {
      if (lockedOut) return;
      if (buffer.length >= 4) return;
      buffer += d;
      updateDots();

      if (buffer.length === 4) {
        if (buffer === REQUIRED_PIN) {
          pinError.textContent = "";
          setTimeout(() => {
            pinScreen.style.display = "none";
            dashboard.style.display = "flex";
          }, 120);
        } else {
          resetPin(true);
        }
      }
    }

    function handleBackspace() {
      if (!buffer.length) return;
      buffer = buffer.slice(0, -1);
      updateDots();
    }

    document.querySelectorAll(".pin-key").forEach(key => {
      key.addEventListener("click", () => {
        const val = key.getAttribute("data-key");
        if (val === "clear") {
          resetPin(false);
        } else if (val === "back") {
          handleBackspace();
        } else {
          handleDigit(val);
        }
      });
    });

    // Optional: allow keyboard input of 0-9 and Backspace
    window.addEventListener("keydown", e => {
      if (dashboard.style.display === "flex") return;
      if (e.key >= "0" && e.key <= "9") {
        handleDigit(e.key);
      } else if (e.key === "Backspace") {
        handleBackspace();
      } else if (e.key.toLowerCase() === "c") {
        resetPin(false);
      }
    });

    // ----- TOGGLE LOGIC -----
    const powerToggle = document.getElementById("power-toggle");
    const statusText = document.getElementById("status-text");

    let isOn = false;

    function updateToggleVisual() {
      if (isOn) {
        powerToggle.classList.remove("off");
        powerToggle.classList.add("on");
        powerToggle.style.color = "#4fd57a";
        powerToggle.setAttribute("aria-pressed", "true");
        statusText.textContent = "Status • ONLINE";
        statusText.classList.add("on");
      } else {
        powerToggle.classList.remove("on");
        powerToggle.classList.add("off");
        powerToggle.style.color = "#ff4b4b";
        powerToggle.setAttribute("aria-pressed", "false");
        statusText.textContent = "Status • OFFLINE";
        statusText.classList.remove("on");
      }
    }

    powerToggle.addEventListener("click", () => {
      isOn = !isOn;
      updateToggleVisual();
      // Hook your real protocol here
      // if (isOn) startProtocol(); else stopProtocol();
    });

    // Initialize visuals
    updateToggleVisual();
  </script>
</body>
</html>
